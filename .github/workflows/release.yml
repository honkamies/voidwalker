name: Publish Voidwalker Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package Chromium & Firefox Extension Bundles
        run: |
          python3 - << 'PY'
          import zipfile, os, json

          with open("manifest.json", "r", encoding="utf-8") as f:
              base_manifest = json.load(f)

          version = base_manifest.get("version", "1.0.0")
          include_items = ["README.md", "CHANGELOG.md", "test-lab.html", "src", "popup", "icons", "welcome"]

          chrome_manifest = dict(base_manifest)
          chrome_manifest["background"] = {"service_worker": "src/background.js"}

          firefox_manifest = dict(base_manifest)
          firefox_manifest["background"] = {"scripts": ["src/background.js"]}

          def build_pkg(zip_path, manifest_obj):
              os.makedirs(os.path.dirname(zip_path), exist_ok=True)
              with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as zf:
                  zf.writestr("manifest.json", json.dumps(manifest_obj, indent=2) + "\n")
                  for item in include_items:
                      if os.path.isfile(item):
                          zf.write(item, item)
                      elif os.path.isdir(item):
                          for root, _, files in os.walk(item):
                              for fn in files:
                                  fp = os.path.join(root, fn)
                                  zf.write(fp, fp)

          build_pkg(f"releases/voidwalker-v{version}.zip", chrome_manifest)
          build_pkg(f"releases/voidwalker-firefox-v{version}.zip", firefox_manifest)
          build_pkg("releases/voidwalker-chromium.zip", chrome_manifest)
          build_pkg("releases/voidwalker-firefox.zip", firefox_manifest)
          PY

      - name: Extract Release Notes from CHANGELOG.md
        run: |
          python3 - << 'PY'
          import re, os

          tag = os.environ.get("GITHUB_REF_NAME", "")
          version = tag.lstrip("v")

          changelog_section = ""
          if os.path.exists("CHANGELOG.md"):
              with open("CHANGELOG.md", "r", encoding="utf-8") as f:
                  content = f.read()
              pattern = rf"##\s*\[?v?{re.escape(version)}\]?[^\n]*\n(.*?)(?=\n##\s*\[?v?\d|\Z)"
              match = re.search(pattern, content, re.DOTALL)
              if match:
                  changelog_section = match.group(1).strip()

          sep = "\n\n---\n\n"
          body_parts = [
              f"## 🛡️ Voidwalker {tag}",
              "### 🆕 What's New in this Release\n" + (changelog_section if changelog_section else "Performance improvements and defense updates."),
              sep,
              f"### 📦 Which file should I download?\n* **Chrome, Brave, Edge, Vivaldi, Opera, Arc, Kiwi (Android), Lemur (Android), Orion (iOS/macOS):**\n  👉 Download **`voidwalker-{tag}.zip`** (or `voidwalker-chromium.zip`) below\n* **Firefox (Desktop & Android), Zen Browser, LibreWolf, Waterfox, Mullvad Browser:**\n  👉 Download **`voidwalker-firefox-{tag}.zip`** (or `voidwalker-firefox.zip`) below",
              sep,
              "### ✨ Core Privacy Architecture\n1. **Universal-Encoding Consent Wall Spoofer (`0.00ms`):** Fakes IAB TCF v2.2 (`__tcfapi`), Sourcepoint, OneTrust, Cookiebot, and Didomi consent across UTF-8, ISO-8859-1, Windows-1252, and mojibake encodings while removing scroll locks.\n2. **Stateful Shadow Cookie Ledger (`Locked`):** Mutates tracking cookies into format-preserving fake IDs across host-only and parent-domain scopes, blocking overwrites and version bumps.\n3. **In-Memory JS Variable Network Scrubber:** Replaces raw tracking IDs in outgoing `fetch()`, `XMLHttpRequest`, and `navigator.sendBeacon()` URLs and payloads before packets leave the browser.\n4. **6-Surface Randomized Hardware Privacy Layer (`0.00ms`):** Spoofs Canvas 2D, WebGL GPU vendor/renderer, `AudioContext` DSP waveforms, `window.screen` geometry, Client Hints, and battery status.\n5. **One-Click Site Exclusion (Whitelist):** Toggle domain exclusion right from the popup to preserve 100% native functionality on video/account-heavy services like YouTube."
          ]
          with open("RELEASE_BODY.md", "w", encoding="utf-8") as f:
              f.write("".join(body_parts))
          PY

      - name: Create GitHub Release & Upload Packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "🛡️ Voidwalker ${{ github.ref_name }} — Universal Anti-Tracking, Consent Spoofer & Hardware Privacy Layer"
          files: |
            releases/voidwalker-*.zip
          body_path: RELEASE_BODY.md
          generate_release_notes: true
